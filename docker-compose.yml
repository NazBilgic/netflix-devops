services:
  frontend:
    build: ./frontend
    ports:
      - "3001:80"

  backend:
    build: ./backend
    ports:
      - "5000:5000"

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./prometheus:/etc/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3002:3000"
